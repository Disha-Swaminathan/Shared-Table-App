/* iPhone 14 layout, in logical CSS pixels. */
:root{--paper:#fffdf9;--ink:#261c18;--red:#cf461c;--line:#ecd5c9;--gold:#ffd46c;--muted:#67534b;--frame:390px;--orange:#ef642c;--blush:#fff3ec}
html{background:#f2eee9}
body{max-width:var(--frame);min-height:100svh;margin:auto;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,&quot;Helvetica Neue&quot;,Arial,sans-serif}
h1,h2,h3,.wordmark,.role strong,.avatar{font-family:inherit;letter-spacing:-.025em;font-weight:700}
h1{font-size:26px}h2{font-size:22px}h3{font-size:18px}
.wrap{width:calc(100% - 30px);max-width:none}
.top{border-bottom:0}.bar{min-height:46px}.wordmark{font-size:15px;letter-spacing:-.02em}
.section{padding:8px 0 78px}.section&gt;.row:first-child{display:block}.section&gt;.row:first-child label{display:inline-flex;align-items:center;gap:7px;font-size:12px;margin:11px 0 0}.section&gt;.row:first-child select{padding:4px 6px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr;gap:23px;margin-top:10px}
.card,.panel{background:var(--blush);border-radius:13px}
.card&gt;.imageButton .photo{aspect-ratio:1.92}
.cardInfo{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 14px;min-height:142px;align-items:start}
.cardInfo h3,.invite h3,.inviteBottom h3{font-size:16px;margin-bottom:2px}
.cardInfo p,.invite p,.inviteBottom p{font-size:13px;margin:0}
.cardInfo .chips{margin:2px 0 0;justify-content:flex-end;gap:5px}
.cardAction{grid-column:1/-1;justify-self:end;align-self:end}
.chip{border-radius:8px;background:#fff9f5;padding:4px 8px}
.undated{font-size:13px;color:var(--muted)}
.button,.quiet{font-size:14px;padding:8px 13px}
.button{background:#c83f17;border-color:#c83f17}.button:hover{background:#a93212}
.bottom{display:flex;position:fixed;bottom:0;left:50%;right:auto;transform:translateX(-50%);width:min(100%,var(--frame));z-index:2;background:#fff0e7;border-top:1px solid var(--line);justify-content:space-around;padding:5px 4px max(5px,env(safe-area-inset-bottom));gap:0}
.bottom button{min-width:83px;font-size:10px;padding:3px 8px}.bottom .icon{display:block;margin:0 auto 1px}
.nav button[aria-current],.tabs button[aria-selected=true]{background:#ffd7bd;color:#782a10}
.hero,.onboard .hero{margin:0;min-height:0;border-radius:0;padding:14px 0;background:none;color:var(--ink)}
.hero h1{font-size:32px}.hero p,.hero .kicker{color:var(--muted)}.hero .kicker{display:none}
.onboard{display:block;min-height:0;padding:0 0 25px}.onboard section{padding:0}
.roleScreen{position:relative;display:grid;grid-template-rows:1fr 1fr;min-height:100svh}
.roleHalf{display:grid;place-items:center;border:0;border-radius:0;color:#49200f;font-size:34px;font-weight:750;letter-spacing:-.045em}
.roleHost{background:#ff9b6d;border-bottom:1px solid #b34b29}.roleGuest{background:#ffe5a8}
.roleHalf span{display:grid;place-items:center;width:164px;aspect-ratio:1;border:2px solid currentColor;border-radius:50%}
.roleInfo{position:absolute;top:20px;left:20px;z-index:1;border:0;background:transparent;font-size:26px}.demoLink{margin-top:12px}
.detailHero{aspect-ratio:1.77;margin:0 0 12px;border-radius:18px}
.detail.section:has(.detailHero){width:100%;position:relative;padding-top:0}
.detail:has(.detailHero)&gt;:not(.detailHero):not(:first-child):not(.detailAction){margin-left:16px;margin-right:16px}
.detail:has(.detailHero)&gt;button:first-child{position:absolute;top:12px;left:13px;background:#fffdf9}
.detailDate{justify-content:center;margin:22px auto 40px;max-width:230px}.detailDate .chip:last-child:nth-child(3){margin:3px 30px 0}
.detailAction{position:fixed;bottom:57px;z-index:1;left:50%;transform:translateX(-50%);white-space:nowrap}
.detail .block.panel{background:none;border:0;padding:0}.host{width:120px;height:160px}
.peopleCount{display:flex;align-items:center;gap:12px;margin:36px 0 45px}.peopleCount h3{margin:0}
.detail .gallery{margin-top:12px}.detail .gallery .photo{aspect-ratio:1.33}
.detail .block:last-child .gallery{grid-auto-flow:column;grid-auto-columns:72%;grid-template-columns:none;overflow:auto}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin:0 0 25px;background:#f5e9e1;padding:2px}.tabs button{font-size:13px;padding:5px 3px}
.invite{grid-template-columns:42% 1fr;padding:12px;gap:12px}.invite .photo{aspect-ratio:1.36;border-radius:22px}.invite .chips{margin-bottom:0}
.upcoming{padding:12px 15px}.inviteTop{display:grid;grid-template-columns:47% 1fr;gap:13px}.inviteTop .photo,.envelopeTile{aspect-ratio:1.4;border-radius:23px}
.envelopeTile{position:relative;border:0;background:#f4a480;display:grid;place-items:center}.envelopeArt{position:relative;width:61px;height:42px;background:#fff8ed;border-radius:5px;box-shadow:0 3px 6px #7b321f44}.envelopeArt:before{content:&quot;&quot;;position:absolute;inset:0;background:#ffdac2;clip-path:polygon(0 0,100% 0,50% 61%)}.unread{position:absolute;top:6px;right:8px;width:11px;height:11px;background:#a62c14;border-radius:50%}
.inviteBottom{margin-top:13px}.inviteTools{display:flex;gap:7px}.inviteTools .quiet{font-size:20px;width:36px;height:36px;padding:0;background:#ffd7bd}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
dialog{width:min(350px,100% - 34px);border-radius:26px;background:#fffdf9}
.invitationLetter{position:relative;margin:8px 0 35px;border-color:#efc7a9;background:#fff8ed}.invitationLetter:after{content:&quot;&quot;;position:absolute;left:-9px;right:-9px;top:calc(100% - 8px);height:35px;background:#efaa83;clip-path:polygon(0 0,50% 70%,100% 0,100% 100%,0 100%);border-radius:0 0 8px 8px}
.profile .avatar{margin:12px auto}.profile&gt;.row{justify-content:center}.profile&gt;.kicker{text-align:center}.profile&gt;.row h1{font-size:24px}

.onboard{padding-top:20px}

 if(tab===&#x27;Upcoming&#x27;)return &#x27;&lt;article class=&quot;panel upcoming&quot;&gt;&lt;div class=&quot;inviteTop&quot;&gt;&#x27;+photo(c.img,c.name+&#x27; dinner setting&#x27;)+btn(&#x27;&lt;span class=&quot;envelopeArt&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span class=&quot;sr&quot;&gt;Open invitation&lt;/span&gt;&#x27;+(!data.read[i]?&#x27;&lt;span class=&quot;unread&quot; aria-label=&quot;New&quot;&gt;&lt;/span&gt;&#x27;:&#x27;&#x27;),&#x27;letter:&#x27;+i,&#x27;envelopeTile&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;row inviteBottom&quot;&gt;&lt;div&gt;&lt;h3&gt;&#x27;+c.name+&#x27;&lt;/h3&gt;&lt;p&gt;&#x27;+dateLine(c)+&#x27;&lt;/p&gt;&lt;/div&gt;&#x27;+(data.read[i]?&#x27;&lt;div class=&quot;inviteTools&quot;&gt;&#x27;+btn(icon(&#x27;Location&#x27;)+&#x27;&lt;span class=&quot;sr&quot;&gt;Location&lt;/span&gt;&#x27;,&#x27;location:&#x27;+i,&#x27;quiet&#x27;)+btn(icon(&#x27;Chat&#x27;)+&#x27;&lt;span class=&quot;sr&quot;&gt;Message host&lt;/span&gt;&#x27;,&#x27;message:&#x27;+i,&#x27;quiet&#x27;)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&lt;/article&gt;&#x27;;
 if(tab===&#x27;Requested&#x27;) actions=&#x27;&lt;span class=&quot;chip&quot;&gt;Invite requested&#x27;+(data.requests[i].plus?&#x27; · +1&#x27;:&#x27;&#x27;)+&#x27;&lt;/span&gt; &#x27;+btn(&#x27;Simulate host approval&#x27;,&#x27;approve:&#x27;+i,&#x27;quiet&#x27;);

 return &#x27;&lt;article class=&quot;panel pad invite&quot;&gt;&#x27;+photo(c.img,c.name+&#x27; dinner setting&#x27;)+&#x27;&lt;div&gt;&lt;h3&gt;&#x27;+c.name+&#x27;&lt;/h3&gt;&lt;p&gt;&#x27;+dateLine(c)+&#x27;&lt;/p&gt;&lt;div class=&quot;chips&quot;&gt;&#x27;+actions+&#x27;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;&#x27;;
 }).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;empty&quot;&gt;&lt;p&gt;Your requests will appear here once you ask for a seat.&lt;/p&gt;&#x27;+btn(&#x27;Browse supper clubs&#x27;,&#x27;Browse&#x27;)+&#x27;&lt;/div&gt;&#x27;)+&#x27;&lt;/div&gt;&lt;/main&gt;&#x27;;
}
const detailList=()=&gt;&#x27;&lt;dl&gt;&#x27;+[[&#x27;Name&#x27;,&#x27;name&#x27;],[&#x27;Mobile number&#x27;,&#x27;phone&#x27;],[&#x27;Gender&#x27;,&#x27;gender&#x27;],[&#x27;Pronouns&#x27;,&#x27;pronouns&#x27;],[&#x27;Age group&#x27;,&#x27;age&#x27;],[&#x27;Profession and interests&#x27;,&#x27;interests&#x27;],[&#x27;Relationship with food&#x27;,&#x27;food&#x27;],[&#x27;Dietary preferences&#x27;,&#x27;diet&#x27;],[&#x27;Other dietary details&#x27;,&#x27;dietOther&#x27;],[&#x27;Allergies&#x27;,&#x27;allergies&#x27;]].map(([label,k])=&gt;&#x27;&lt;dt&gt;&#x27;+label+&#x27;&lt;/dt&gt;&lt;dd&gt;&#x27;+esc(data.profile[k]||&#x27;Not provided&#x27;)+&#x27;&lt;/dd&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/dl&gt;&#x27;;
function profile(){
 const groups=[
 [&#x27;Account&#x27;,&#x27;&lt;p&gt;Guest account · &#x27;+esc(data.profile.phone||&#x27;Demo sign-in&#x27;)+&#x27;&lt;/p&gt;&#x27;+btn(&#x27;Return to sign-in&#x27;,&#x27;signout&#x27;,&#x27;quiet&#x27;)],
 [&#x27;Personal details&#x27;,detailList()+btn(&#x27;Edit personal details&#x27;,&#x27;editProfile&#x27;)],
 [&#x27;Location&#x27;,&#x27;&lt;form data-form=&quot;city&quot;&gt;&#x27;+field(&#x27;City&#x27;,&#x27;city&#x27;,&#x27;text&#x27;,true)+submit(&#x27;Save location&#x27;)+&#x27;&lt;/form&gt;&#x27;],
 [&#x27;Notification settings&#x27;,&#x27;&lt;form data-form=&quot;alerts&quot;&gt;&lt;label&gt;&lt;span&gt;&lt;input type=&quot;checkbox&quot; name=&quot;alerts&quot; &#x27;+(data.alerts?&#x27;checked&#x27;:&#x27;&#x27;)+&#x27;&gt; Supper club reminders&lt;/span&gt;&lt;/label&gt;&#x27;+submit(&#x27;Save preferences&#x27;)+&#x27;&lt;/form&gt;&#x27;],
 [&#x27;Terms &amp; Conditions&#x27;,&#x27;&lt;p&gt;Respect the host’s home and fellow guests. If your plans change, let the host know. This demo uses fictional dinners and does not create reservations or take payments.&lt;/p&gt;&#x27;],
 [&#x27;Privacy&#x27;,&#x27;&lt;p&gt;This prototype saves your details and activity in this browser. Use sample details while exploring the demo.&lt;/p&gt;&#x27;],
 [&#x27;Help&#x27;,&#x27;&lt;p&gt;Request a seat from Browse. If your request is accepted, open your invitation in Invites to see the dinner details and message your host.&lt;/p&gt;&#x27;]
 ];
 return &#x27;&lt;main class=&quot;wrap section profile&quot;&gt;&lt;div class=&quot;avatar&quot; aria-hidden=&quot;true&quot;&gt;&#x27;+esc((data.profile.name||&#x27;G&#x27;)[0].toUpperCase())+&#x27;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;h1&gt;Hi &#x27;+esc(data.profile.name||&#x27;Guest&#x27;)+&#x27;&lt;/h1&gt;&#x27;+btn(&#x27;Edit profile&#x27;,&#x27;editProfile&#x27;,&#x27;quiet&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;kicker&quot;&gt;Your guest profile&lt;/div&gt;&#x27;+groups.map(([title,body])=&gt;&#x27;&lt;details&gt;&lt;summary&gt;&#x27;+title+&#x27;&lt;/summary&gt;&lt;div&gt;&#x27;+body+&#x27;&lt;/div&gt;&lt;/details&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/main&gt;&#x27;;
}
function render(){
 const inside=[&#x27;Browse&#x27;,&#x27;detail&#x27;,&#x27;Invites&#x27;,&#x27;Profile&#x27;].includes(page);
 app.innerHTML=(inside?&#x27;&lt;header class=&quot;top&quot;&gt;&lt;div class=&quot;wrap bar&quot;&gt;&lt;span class=&quot;wordmark&quot;&gt;Shared Table&lt;/span&gt;&#x27;+&#x27;&lt;/div&gt;&lt;/header&gt;&#x27;:&#x27;&#x27;)+(inside?({Browse:browse,detail,Invites:invites,Profile:profile})[page]():onboarding())+(inside?nav(true):&#x27;&#x27;);
}
function start(){data.started=true;save();go(&#x27;Browse&#x27;);}
function openSetup(returnTo){step=0;setupReturn=returnTo;go(&#x27;setup&#x27;);}
function finishSetup(){if(setupReturn===&#x27;request&#x27;){go(&#x27;detail&#x27;);verify();}else if(setupReturn===&#x27;Profile&#x27;)go(&#x27;Profile&#x27;);else start();}
function verify(){modal(&#x27;Verify your details&#x27;,&#x27;&lt;p&gt;Check what your host will see with your request.&lt;/p&gt;&#x27;+detailList()+&#x27;&lt;div class=&quot;row&quot;&gt;&#x27;+btn(&#x27;Edit&#x27;,&#x27;editRequest&#x27;,&#x27;quiet&#x27;)+btn(&#x27;Proceed →&#x27;,&#x27;plus&#x27;)+&#x27;&lt;/div&gt;&#x27;);}

function showLetter(i){
 const c=clubs[i];data.read[i]=true;save();render();
 modal(&#x27;A letter from your host&#x27;,&#x27;&lt;article class=&quot;letter invitationLetter&quot;&gt;&lt;div class=&quot;kicker&quot;&gt;You’re invited · &#x27;+c.name+&#x27;&lt;/div&gt;&lt;p&gt;Dear &#x27;+esc(data.profile.name)+&#x27;,&lt;/p&gt;&lt;p&gt;It’s a pleasure to have you at our place for dinner on &#x27;+c.date+&#x27; at &#x27;+c.time+&#x27;. We’ve taken note of the dietary details in your request. Please message me if anything changes so we can talk through the menu together.&lt;/p&gt;&lt;p&gt;Come ready for a slow meal, shared plates, and good company.&lt;/p&gt;&lt;p&gt;With love and care,&lt;br&gt;&#x27;+c.host+&#x27;&lt;br&gt;&#x27;+c.name+&#x27;&lt;/p&gt;&lt;/article&gt;&lt;div class=&quot;chips&quot;&gt;&#x27;+btn(&#x27;Location&#x27;,&#x27;location:&#x27;+i,&#x27;quiet&#x27;)+btn(&#x27;Message host&#x27;,&#x27;message:&#x27;+i)+&#x27;&lt;/div&gt;&#x27;);

document.addEventListener(&#x27;click&#x27;,e=&gt;{
 const button=e.target.closest(&#x27;[data-action]&#x27;);
 if(!button)return;
 const [action,arg]=button.dataset.action.split(&#x27;:&#x27;);const i=Number(arg);
 switch(action){
 case &#x27;Browse&#x27;:case &#x27;Invites&#x27;:case &#x27;Profile&#x27;:case &#x27;login&#x27;:case &#x27;role&#x27;:case &#x27;intro&#x27;:case &#x27;welcome&#x27;:go(action);break;
 case &#x27;demo&#x27;:start();break;
 case &#x27;host&#x27;:modal(&#x27;Host a supper club&#x27;,&#x27;&lt;p&gt;The host role is shown here for onboarding. Explore the guest experience in this demo.&lt;/p&gt;&#x27;+btn(&#x27;Continue as a guest&#x27;,&#x27;login&#x27;));break;
 case &#x27;about&#x27;:modal(&#x27;What is a supper club?&#x27;,&#x27;&lt;p&gt;A small, curated dinner in a private space, often someone’s home. Guests request a seat, and the host sends an invitation to the people joining the table.&lt;/p&gt;&#x27;);break;
 case &#x27;setup&#x27;:openSetup(&#x27;&#x27;);break;
 case &#x27;editProfile&#x27;:openSetup(&#x27;Profile&#x27;);break;
 case &#x27;editRequest&#x27;:openSetup(&#x27;request&#x27;);break;
 case &#x27;endSetup&#x27;:finishSetup();break;
 case &#x27;prev&#x27;:step--;render();break;
 case &#x27;detail&#x27;:current=i;go(&#x27;detail&#x27;);break;
 case &#x27;request&#x27;:current=i;plus=&#x27;&#x27;;if(data.requests[i]){tab=data.requests[i].accepted?&#x27;Upcoming&#x27;:&#x27;Requested&#x27;;go(&#x27;Invites&#x27;);}else verify();break;
 case &#x27;verify&#x27;:verify();break;
 case &#x27;plus&#x27;:case &#x27;plusYes&#x27;:case &#x27;plusNo&#x27;:if(action!==&#x27;plus&#x27;)plus=action===&#x27;plusYes&#x27;?&#x27;yes&#x27;:&#x27;no&#x27;;plusModal();break;
 case &#x27;send&#x27;:if(plus&amp;&amp;!data.requests[current]){data.requests[current]={plus:plus===&#x27;yes&#x27;,accepted:false};save();tab=&#x27;Requested&#x27;;go(&#x27;Invites&#x27;);alertUser(&#x27;Invite requested&#x27;);}break;
 case &#x27;watch&#x27;:data.watch[i]=!data.watch[i];save();render();alertUser(data.watch[i]?&#x27;Saved to your date notifications&#x27;:&#x27;Date notifications turned off&#x27;);break;
 case &#x27;tab&#x27;:tab=arg;render();break;

 case &#x27;review&#x27;:current=i;reviewRating=data.reviews[i]?.rating||5;modal(&#x27;Leave a review&#x27;,&#x27;&lt;p&gt;How was &#x27;+clubs[i].name+&#x27;?&lt;/p&gt;&lt;form data-form=&quot;review&quot;&gt;&lt;label&gt;Rating&lt;select name=&quot;rating&quot;&gt;&#x27;+[5,4,3,2,1].map(n=&gt;&#x27;&lt;option value=&quot;&#x27;+n+&#x27;&quot; &#x27;+(n===Number(reviewRating)?&#x27;selected&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;+n+&#x27; / 5&lt;/option&gt;&#x27;).join(&#x27;&#x27;)+&#x27;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Your guest note&lt;textarea name=&quot;note&quot; required&gt;&#x27;+esc(data.reviews[i]?.note)+&#x27;&lt;/textarea&gt;&lt;/label&gt;&#x27;+submit(&#x27;Save review&#x27;)+&#x27;&lt;/form&gt;&#x27;);break;
 case &#x27;people&#x27;:showPeople();break;
 case &#x27;connect&#x27;:data.connections[arg]=true;save();showPeople();break;
 case &#x27;allReviews&#x27;:modal(&#x27;Guest notes, reviews&#x27;,&#x27;&lt;div class=&quot;stack&quot;&gt;&#x27;+reviewCards()+&#x27;&lt;/div&gt;&#x27;);break;
 case &#x27;signout&#x27;:data.started=false;save();go(&#x27;role&#x27;);break;
 case &#x27;close&#x27;:close();break;
 }
});
document.addEventListener(&#x27;change&#x27;,e=&gt;{if(e.target.id===&#x27;sort&#x27;){sort=e.target.value;render();document.querySelector(&#x27;#sort&#x27;).focus();}});
document.addEventListener(&#x27;submit&#x27;,e=&gt;{
 const form=e.target;if(!form.dataset.form)return;e.preventDefault();
 const fields=Object.fromEntries(new FormData(form));const type=form.dataset.form;
 if([&#x27;login&#x27;,&#x27;setup&#x27;,&#x27;city&#x27;].includes(type)){Object.assign(data.profile,fields);save();}
